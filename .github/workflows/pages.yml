name: Deploy dashboard to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - uses: actions/configure-pages@v5
      - run: npm ci --no-audit --no-fund
        working-directory: app/web
      - run: npx tsc --noEmit && node pages-build.mjs
        working-directory: app/web
        env:
          VITE_BASE: /waterflood-intelligence/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/web/dist-pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
